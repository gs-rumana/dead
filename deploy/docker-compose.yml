# Runs on the Oracle Always Free VM (§9). Caddy terminates TLS for wss://.
services:
  game:
    image: ghcr.io/${GITHUB_OWNER:-dead-tracks}/dead-tracks-server:latest
    restart: unless-stopped
    environment:
      - PORT=2567
      - REGION=eu
      # Accounts (§4.12): a long random secret, and where the client and this server live.
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - PUBLIC_URL=https://${SERVER_DOMAIN}
      # Optional sign-in providers: leave empty to hide a button.
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
    expose:
      - '2567'
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
